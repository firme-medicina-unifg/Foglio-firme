ient(90deg,var(--ink-soft),var(--ok-soft));color:var(--fg)}\n.cal-testa,.cal-filtri,.cal-giorni,.cal-lista,.cal-piede{flex-shrink:0}\n.cal-vuoto{color:var(--muted);text-align:center;padding:22px 0;margin:0}\n.cal-piede{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:12px}\n.cal-piede a{color:var(--ink);font-weight:700}\n.cal-carica{opacity:.55;pointer-events:none;transition:opacity .2s}\n.cal-agg .cal-piede span::after{content:\" · ⟳\";opacity:.7}\n/* ---------- scritta Script (come nel video) ---------- */\n.script-logo{display:inline-block;line-height:1.05;padding:0 .05em .12em;margin:0 -.05em -.12em;font-family:\"Inter\",\"Helvetica Neue\",Arial,system-ui,sans-serif;font-weight:800;letter-spacing:-.045em;white-space:nowrap}\n.script-logo b{font-weight:800;background:linear-gradient(100deg,#7d8cff 0%,#4f5fe6 38%,#1d3a8a 70%,#6f7ff5 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:logoLuce 7s ease-in-out infinite alternate}\n@media (prefers-color-scheme: dark){.script-logo b{background-image:linear-gradient(100deg,#c7d0ff 0%,#8b9cff 35%,#5b6cf0 60%,#c7d0ff 100%)}}\n@keyframes logoLuce{from{background-position:0 0}to{background-position:100% 0}}\n@media (prefers-reduced-motion:reduce){.script-logo b{animation:none}}\n.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}\n.brand .script-logo{font-size:1.85rem}\n/* ---------- menu a tendina (calendario, lingua, versione) ---------- */\n.menu-t{position:relative;flex:none}\n.menu-tbtn{position:relative;display:flex;align-items:center;gap:8px;min-height:42px;padding:6px 14px 6px 11px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);\n  font:700 .92rem var(--f-body,inherit);cursor:pointer;transition:border-color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}\n.menu-tbtn:hover,.menu-tbtn[aria-expanded=\"true\"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink-soft)}\n.menu-tbtn .ham{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}\n.menu-tbtn .ham path{transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .2s;transform-origin:12px 12px}\n.menu-tbtn[aria-expanded=\"true\"] .ham .a{transform:translateY(5px) rotate(45deg)}\n.menu-tbtn[aria-expanded=\"true\"] .ham .b{opacity:0}\n.menu-tbtn[aria-expanded=\"true\"] .ham .c{transform:translateY(-5px) rotate(-45deg)}\n.nv-dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#5b6cf0;flex:none;position:relative}\n.menu-tbtn .nv-dot{position:absolute;top:-3px;right:-3px;border:2px solid var(--card);width:14px;height:14px}\n@media (prefers-reduced-motion:no-preference){\n  .nv-dot{animation:nvResp 2.2s ease-in-out infinite}\n  .nv-dot::after{content:\"\";position:absolute;inset:-4px;border-radius:50%;border:2px solid #5b6cf0;animation:nvOnda 2.2s ease-out infinite}\n}\n@keyframes nvResp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}\n@keyframes nvOnda{0%{transform:scale(.7);opacity:.7}80%,100%{transform:scale(1.9);opacity:0}}\n.menu-pan{position:absolute;right:0;top:calc(100% + 8px);z-index:40;width:min(300px,calc(100vw - 32px));padding:8px;border:1px solid var(--line);border-radius:18px;background:var(--card);\n  box-shadow:0 18px 50px -12px rgba(15,18,26,.38);transform-origin:top right}\n.mt-voce{display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px;border:0;border-radius:12px;background:transparent;color:var(--fg);font:700 1rem var(--f-body,inherit);cursor:pointer;text-align:left}\n.mt-voce:hover,.mt-voce:focus-visible{background:var(--ink-soft)}\n.mt-voce .ic{width:22px;height:22px;flex:none;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\n.mt-voce .v{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;font-size:.92rem}\n.mt-sep{height:1px;backgroun    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv id=\"loading\" class=\"panel muted\" data-t\u003eCarico la lezione…\u003c/div\u003e\n\n  \u003cdiv id=\"stop\" class=\"panel\" hidden\u003e\n    \u003ch2 id=\"stopTitle\"\u003e\u003c/h2\u003e\n    \u003cp class=\"muted\" id=\"stopMsg\"\u003e\u003c/p\u003e\n  \u003c/div\u003e\n\n\n  \u003c!-- non riconosciuto: serve l'account UNIFG --\u003e\n  \u003cdiv id=\"stepLogin\" class=\"panel\" hidden\u003e\n    \u003cdiv id=\"avvisoAltroAccount\" class=\"avviso-forte\" hidden\u003e\u003c/div\u003e\n    \u003ch2 data-t\u003eAccedi con il tuo account UNIFG\u003c/h2\u003e\n    \u003cp data-t class=\"muted\"\u003ePer firmare il sito deve riconoscerti dal tuo account Google dell'università (quello che finisce con @unifg.it).\u003c/p\u003e\n    \u003cul class=\"muted small\" style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px\"\u003e\n      \u003cli data-t\u003ePremi il tasto qui sotto e scegli il tuo account @unifg.it.\u003c/li\u003e\n      \u003cli data-t\u003eSe sul telefono hai più account Google, apri il link in una finestra in incognito ed entra solo con quello UNIFG.\u003c/li\u003e\n      \u003cli data-t\u003eSe hai aperto il link dentro WhatsApp o Instagram, aprilo con Chrome o Safari.\u003c/li\u003e\n    \u003c/ul\u003e\n    \u003ca class=\"btn primary block\" id=\"loginBtn\" href=\"#\" target=\"_top\" style=\"text-align:center;text-decoration:none\" data-t\u003eAccedi con l'account UNIFG\u003c/a\u003e\n  \u003c/div\u003e\n\n  \u003c!-- 2. dati --\u003e\n  \u003cform id=\"step1\" class=\"panel\" novalidate hidden\u003e\n    \u003cdiv class=\"who-mail\"\u003e\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none\"\u003e\u003cpath d=\"M5 12.5l4.5 4.5L19 7.5\"/\u003e\u003c/svg\u003e\u003cspan\u003e\u003cspan data-t\u003eFirmi come\u003c/span\u003e \u003cb id=\"whoMail\"\u003e\u003c/b\u003e\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv class=\"grid2\"\u003e\n      \u003cdiv class=\"field\"\u003e\u003clabel for=\"fNome\" data-t\u003eNome\u003c/label\u003e\u003cinput id=\"fNome\" autocomplete=\"given-name\" autocapitalize=\"words\" enterkeyhint=\"next\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"field\"\u003e\u003clabel for=\"fCognome\" data-t\u003eCognome\u003c/label\u003e\u003cinput id=\"fCognome\" autocomplete=\"family-name\" autocapitalize=\"words\" enterkeyhint=\"next\"\u003e\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"field\"\u003e\u003clabel for=\"fMatricola\" data-t\u003eMatricola\u003c/label\u003e\u003cinput id=\"fMatricola\" class=\"mono\" inputmode=\"numeric\" autocomplete=\"off\" enterkeyhint=\"next\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"field\"\u003e\n      \u003clabel for=\"fUscita\" data-t\u003eOrario di uscita \u003cspan class=\"opt\"\u003efacoltativo\u003c/span\u003e\u003c/label\u003e\n      \u003cdiv class=\"timerow\"\u003e\u003cinput id=\"fUscita\" type=\"time\" step=\"300\"\u003e\u003cbutton class=\"btn ghost\" type=\"button\" id=\"uscitaClear\" hidden data-t\u003eTogli\u003c/button\u003e\u003c/div\u003e\n      \u003cspan class=\"muted small\" data-t\u003eCompilalo solo se esci prima della fine della lezione.\u003c/span\u003e\n    \u003cdiv class=\"avviso-arancio\" id=\"avvOmonimi\" role=\"note\" hidden\u003e\n      \u003cb class=\"at\" data-t\u003eSiete due persone con lo stesso nome e cognome in elenco\u003c/b\u003e\n      \u003cspan data-t\u003ePer questo la tua matricola nuova non si collega da sola. Collegala con Jarvis, ci vuole un attimo:\u003c/span\u003e\n      \u003col\u003e\n        \u003cli data-t\u003eTocca «Chiedi a Jarvis» (qui sotto o in alto).\u003c/li\u003e\n        \u003cli data-t\u003eScrivi: «Ho cambiato matricola».\u003c/li\u003e\n        \u003cli data-t\u003eQuando te la chiede, scrivi la TUA matricola nuova (quella che risulta nell'elenco).\u003c/li\u003e\n        \u003cli data-t\u003eJarvis la collega subito e te la scrive qui nel modulo: poi firma normalmente.\u003c/li\u003e\n      \u003c/ol\u003e\n      \u003cbutton class=\"btn\" type=\"button\" id=\"omonimiJarvis\" data-t\u003eApri Jarvis\u003c/button\u003e\n    \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cp class=\"muted small\" data-t\u003eScrivi nome e cognome come risultano all'iscrizione: vengono controllati sull'elenco della classe.\u003c/p\u003e\n    \u003cdiv class=\"err\" id=\"s1Err\" hidden\u003e\u003c/div\u003e\n    \u003cbutton class=\"btn primary block\" type=\"submit\" id=\"s1Btn\"\u003eAvanti: firma\u003c/button\u003e\n  \u003c/form\u003e\n\n  \u003c!-- 3. firma --\u003e\n  \u003cdiv id=\"step2\" class=\"panel\" hidden\u003e\n    \u003cdiv class=\"who\"\u003e\u003cstrong id=\"whoName\"\u003e\u003c/strong\u003e\u003cspan class=\"mono muted\" id=\"whoMat\"\u003e\u003c/span\u003e\u003c/div\u003e\n    \u003cp class=\"muted small\" id=\"whoUscita\" hidden\u003e\u003c/p\u003e\n    \u003cdiv class=\"padbox\"\u003e\n      \u003ccanvas id=\"pad\" aria-label=\"Spazio firma\" data-ta\u003e\u003c/canvas\u003e\n      \u003cdiv class=\"baseline\"\u003e\u003c/div\u003e\u003cdiv class=\"x\"\u003e×\u003c/div\u003e\n      \u003cdiv class=\"hint\" id=\"padHint\" data-t\u003eFirma col dito sulla riga\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"err\" id=\"s2Err\" hidden\u003e\u003c/div\u003e\n    \u003cdiv class=\"row-btns\"\u003e\n      \u003cbutton class=\"btn ghost\" type=\"button\" id=\"backBtn\" data-t\u003eIndietro\u003c/button\u003e\n      \u003cbutton class=\"btn\" type=\"button\" id=\"clearBtn\" data-t\u003eCancella\u003c/button\u003e\n      \u003cbutton class=\"btn primary grow\" type=\"button\" id=\"confirmBtn\" disabled\u003eConferma firma\u003c/button\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003c!-- fatto --\u003e\n  \u003c!-- link riaperto dopo aver firmato --\u003e\n  \u003cdiv id=\"stepGia\" class=\"panel\" hidden\u003e\n    \u003cdiv class=\"check\" style=\"margin:0 auto\"\u003e\u003csvg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M5 12.5l4.5 4.5L19 7.5\"/\u003e\u003c/svg\u003e\u003c/div\u003e\n    \u003ch2 id=\"giaTitolo\" style=\"text-align:center\" data-t\u003eHai già firmato questa lezione\u003c/h2\u003e\n    \u003cp class=\"muted\" id=\"giaMsg\" style=\"text-align:center\"\u003e\u003c/p\u003e\n    \u003cform id=\"giaForm\" novalidate hidden style=\"display:flex;flex-direction:column;gap:12px\"\u003e\n      \u003cdiv class=\"field\"\u003e\n        \u003clabel for=\"gUscita\" data-t\u003eCambia orario di uscita\u003c/label\u003e\n        \u003cinput id=\"gUscita\" type=\"time\" step=\"300\"\u003e\n        \u003cspan class=\"muted small\" data-t\u003eVa subito nel registro dei rappresentanti, senza approvazione. Deve essere da adesso in poi.\u003c/span\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"err\" id=\"giaErr\" hidden\u003e\u003c/div\u003e\n      \u003cdiv class=\"row-btns\"\u003e\u003cbutton class=\"btn\" type=\"button\" id=\"giaTogli\" hidden data-t\u003eTogli orario\u003c/button\u003e\u003cbutton class=\"btn primary grow\" type=\"submit\" id=\"giaSalva\" data-t\u003eSalva orario\u003c/button\u003e\u003c/div\u003e\n    \u003c/form\u003e\n    \u003cp class=\"muted small\" id=\"giaNoOggi\" hidden data-t\u003eL'orario di uscita si può cambiare solo il giorno della lezione. Per correzioni scrivi ai rappresentanti.\u003c/p\u003e\n    \u003cbutton class=\"btn link\" type=\"button\" id=\"giaJarvis\" data-t\u003eServe aiuto? Chiedi a Jarvis\u003c/button\u003e\n  \u003c/div\u003e\n  \u003cdiv id=\"step3\" class=\"panel done\" hidden\u003e\n    \u003cdiv class=\"check\"\u003e\u003csvg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M5 12.5l4.5 4.5L19 7.5\"/\u003e\u003c/svg\u003e\u003c/div\u003e\n    \u003ch2 id=\"doneName\"\u003e\u003c/h2\u003e\n    \u003cp class=\"muted\" id=\"doneMsg\"\u003e\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cp class=\"fb-link\"\u003e\u003cbutton class=\"btn link\" type=\"button\" id=\"fbOpen\" data-t\u003eFeedback e segnalazioni\u003c/button\u003e · \u003cspan data-t\u003eaiutaci a migliorare il sito\u003c/span\u003e\u003c/p\u003e\n\u003c/main\u003e\n\n\u003cdiv class=\"fb-modal\" id=\"temaModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"temaTitle\" hidden\u003e\n  \u003cdiv class=\"fb-box\"\u003e\n    \u003cdiv class=\"fb-head\"\u003e\n      \u003cb id=\"temaTitle\" data-t\u003ePersonalizza\u003c/b\u003e\n      \u003cbutton class=\"x-btn\" type=\"button\" id=\"temaClose\" aria-label=\"Chiudi\" data-ta\u003e\u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"\u003e\u003cpath d=\"M6 6l12 12M18 6L6 18\"/\u003e\u003c/svg\u003e\u003c/button\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"fb-body\" style=\"display:flex;flex-direction:column;gap:12px\"\u003e\n      \u003cp class=\"muted small\" style=\"margin:0\" data-t\u003eScegli i colori: li ritrovi ogni volta che entri con il tuo account, su qualsiasi telefono.\u003c/p\u003e\n      \u003cdiv class=\"tm-anteprima\" aria-hidden=\"true\"\u003e\u003cspan class=\"spark orb\" id=\"tmPrev\" style=\"width:54px;height:54px\"\u003e\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"tm-righe\" id=\"tmRighe\"\u003e\u003c/div\u003e\n      \u003cdiv class=\"tm-stili\" id=\"tmStili\" hidden\u003e\u003c/div\u003e\n      \u003cdiv class=\"tm-pick\" id=\"tmPick\"\u003e\n        \u003cdiv class=\"tm-sv\" id=\"tmSV\"\u003e\u003ccanvas id=\"tmCan\" width=\"300\" height=\"170\"\u003e\u003c/canvas\u003e\u003cspan class=\"tm-knob\" id=\"tmKnob\"\u003e\u003c/span\u003e\u003c/div\u003e\n        \u003cinput class=\"tm-hue\" id=\"tmHue\" type=\"range\" min=\"0\" max=\"359\" step=\"1\" aria-label=\"Tonalità\" data-ta\u003e\n        \u003cdiv class=\"tm-pre\" id=\"tmPre\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"tm-hex\"\u003e\u003cspan class=\"now\" id=\"tmNow\"\u003e\u003c/span\u003e\u003ccode id=\"tmHex\"\u003e\u003c/code\u003e\u003cbutton class=\"btn ghost\" type=\"button\" id=\"tmDef\" data-t\u003eColore originale\u003c/button\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"err\" id=\"tmErr\" hidden\u003e\u003c/div\u003e\n      \u003cdiv class=\"row-btns\"\u003e\u003cbutton class=\"btn\" type=\"button\" id=\"tmReset\" data-t\u003eRipristina tutto\u003c/button\u003e\u003cbutton class=\"btn primary grow\" type=\"button\" id=\"tmSalva\" data-t\u003eSalva\u003c/button\u003e\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003cdiv class=\"fb-modal\" id=\"novModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"novTitle\" hidden\u003e\n  \u003cdiv class=\"fb-box\"\u003e\n    \u003cdiv class=\"fb-head\"\u003e\n      \u003cb id=\"novTitle\" data-t\u003eNovità\u003c/b\u003e\n      \u003cbutton class=\"x-btn\" type=\"button\" id=\"novClose\" aria-label=\"Chiudi\" data-ta\u003e\u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"\u003e\u003cpath d=\"M6 6l12 12M18 6L6 18\"/\u003e\u003c/svg\u003e\u003c/button\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"fb-body\" id=\"novBox\"\u003e\u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\n\u003cdiv class=\"fb-modal\" id=\"calModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"calTitle\" hidden\u003e\n  \u003cdiv class=\"fb-box\"\u003e\n    \u003cdiv class=\"fb-head\"\u003e\n      \u003cb id=\"calTitle\" data-t\u003eCalendario lezioni\u003c/b\u003e\n      \u003cbutton class=\"x-btn\" type=\"button\" id=\"calClose\" aria-label=\"Chiudi\" data-ta\u003e\u003csvg width=\"
