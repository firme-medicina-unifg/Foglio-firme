 0.66 14.54 3.63Z\"/\u003e\u003cpath fill=\"url(#jvP1)\" d=\"M12.53 11.47L16.12 4.28C19.42 3.38 20.62 4.58 19.72 7.88Z\"/\u003e\u003cpath fill=\"url(#jvP2)\" d=\"M12.74 12L20.37 9.46C23.34 11.15 23.34 12.85 20.37 14.54Z\"/\u003e\u003cpath fill=\"url(#jvP3)\" d=\"M12.53 12.53L19.72 16.12C20.62 19.42 19.42 20.62 16.12 19.72Z\"/\u003e\u003cpath fill=\"url(#jvP4)\" d=\"M12 12.74L14.54 20.37C12.85 23.34 11.15 23.34 9.46 20.37Z\"/\u003e\u003cpath fill=\"url(#jvP5)\" d=\"M11.47 12.53L7.88 19.72C4.58 20.62 3.38 19.42 4.28 16.12Z\"/\u003e\u003cpath fill=\"url(#jvP6)\" d=\"M11.26 12L3.63 14.54C0.66 12.85 0.66 11.15 3.63 9.46Z\"/\u003e\u003cpath fill=\"url(#jvP7)\" d=\"M11.47 11.47L4.28 7.88C3.38 4.58 4.58 3.38 7.88 4.28Z\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n      \u003cdiv class=\"who2\"\u003e\u003cb id=\"chatTitle\"\u003eJarvis\u003c/b\u003e\u003csmall id=\"chatSub\" data-t\u003eAssistente delle firme\u003c/small\u003e\u003c/div\u003e\n      \u003cbutton class=\"x-btn\" type=\"button\" id=\"chatClose\" aria-label=\"Chiudi la chat\" data-ta\u003e\u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"\u003e\u003cpath d=\"M6 6l12 12M18 6L6 18\"/\u003e\u003c/svg\u003e\u003c/button\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"chat-log\" id=\"chatLog\" aria-live=\"polite\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"chips\" id=\"chips\" hidden\u003e\u003c/div\u003e\n    \u003cdiv class=\"composer\"\u003e\n      \u003cform id=\"chatForm\"\u003e\n        \u003ctextarea id=\"chatText\" rows=\"1\" maxlength=\"500\" placeholder=\"Scrivi a Jarvis…\" aria-label=\"Messaggio per Jarvis\" data-tp data-ta\u003e\u003c/textarea\u003e\n        \u003cbutton class=\"send\" type=\"submit\" id=\"chatSend\" aria-label=\"Invia\" data-ta disabled\u003e\u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M12 19V5M6 11l6-6 6 6\"/\u003e\u003c/svg\u003e\u003c/button\u003e\n      \u003c/form\u003e\n      \u003cp class=\"note\" data-t\u003eJarvis può sbagliare. Per i casi particolari scrivi ai rappresentanti.\u003c/p\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\n\u003cscript\u003e\n/* ================= Lingua (Italiano · English · Español) ================= */\n(function(){\n  var DIZ = {\n    en: {\n      \"Menu\": \"Menu\",\n      \" · pari e dispari\": \" · even and odd\",\n      \"Link non ancora attivo\": \"Link not active yet\",\n      \"Il link di questa lezione non è ancora attivo: i rappresentanti devono prima mandare al professore la sua area. Riprova tra poco.\": \"This lecture link isn't active yet: the reps first have to send the professor their area. Try again shortly.\",\n      \"Versione\": \"Version\",\n      \"{v} · novità\": \"{v} · what's new\",\n      \"Novità\": \"What's new\",\n      \"Versione {v}\": \"Version {v}\",\n      \"Nuova\": \"New\",\n      \"v{v}\": \"v{v}\",\n      \"Contrappello {n}\": \"Second roll call {n}\",\n      \"Avanti: firma il contrappello\": \"Next: sign the roll call\",\n      \"Contrappello già firmato\": \"Roll call already signed\",\n      \"Hai già firmato questo contrappello. Puoi chiudere la pagina.\": \"You've already signed this roll call. You can close the page.\",\n      \"Contrappello chiuso\": \"Roll call closed\",\n      \"Il professore ha già chiuso il QR di questo contrappello.\": \"The professor has already closed the QR for this roll call.\",\n      \"Il contrappello si firma solo inquadrando con la fotocamera il QR proiettato in aula.\": \"The roll call can only be signed by scanning the QR projected in the lecture hall with your camera.\",\n      \"Contrappello firmato, {nome}!\": \"Roll call signed, {nome}!\",\n      \"La tua presenza al contrappello è registrata. Puoi chiudere la pagina.\": \"Your presence at the roll call has been recorded. You can close the page.\",\n      \"Link personale di un'altra persona\": \"Someone else's personal link\",\n      \"Questo link per firmare è personale: funziona solo con l'account a cui è stato mandato. Se è tuo, esci da Google e rientra con il tuo account @unifg.it.\": \"This signing link is personal: it only works with the account it was sent to. If it's yours, sign out of Google and sign back in with your @unifg.it account.\",\n      \"Link scaduto\": \"Link expired\",\n      \"Il link personale valeva 4 ore ed è scaduto. Chiedi al professore di mandartene un altro.\": \"The personal link was valid for 4 hours and has expired. Ask the professor to send you another one.\",\n      \"Questo link personale non è valido. Chiedi al professore di mandartene un altro.\": \"This personal link isn't valid. Ask the professor to send you another one.\",\n      \"L'orario di uscita deve essere da adesso in poi: ora sono le {h}.\": \"The leaving time must be from now on: it's {h} now.\",\n      \"Il tuo orario di uscita è già passato: non si può più cambiare. Se è un errore scrivi ai rappresentanti.\": \"Your leaving time has already passed: it can't be changed any more. If it's a mistake, write to the reps.\",\n      \"Mi hai già mandato questo messaggio. Se la risposta di prima non ti ha aiutato, prova a spiegarmi meglio cosa succede (per esempio cosa dice la pagina), oppure usa i pulsanti qui sotto.\": \"You've already sent me this message. If my previous answer didn't help, try explaining what's happening in more detail (for example what the page says), or use the buttons below.\",\n      \"Stai scrivendo molto velocemente: aspetta un minuto e poi riprova. Intanto puoi usare i pulsanti qui sotto.\": \"You're writing very fast: wait a minute and try again. Meanwhile you can use the buttons below.\",\n      \"Non ho capito il messaggio. Scrivimi in poche parole qual è il problema con la firma (per esempio: \\\"dice che la matricola non corrisponde\\\").\": \"I didn't understand the message. Tell me in a few words what the problem with signing is (for example: \\\"it says the student ID doesn't match\\\").\",\n      \"Hai cambiato corso o superato il semestre filtro? Succede quasi sempre per questo: hai una matricola nuova, ma la tua email UNIFG ha ancora quella vecchia. Premi il primo pulsante qui sotto: cerco io la tua matricola nuova negli elenchi e la collego alla tua email, così firmi subito.\\nSe non è il tuo caso, controlla che nome, cognome e matricola siano scritti come all'iscrizione (maiuscole, accenti e apostrofi non contano; se hai più nomi basta il primo).\\nSe ancora non va, mandami i dati e la firma: ti aggiungono i rappresentanti.\": \"Did you switch course or pass the first-semester selection (semestre filtro)? That's almost always why: you have a new student ID, but your UNIFG email still has the old one. Tap the first button below: I'll find your new ID in the class lists and link it to your email, so you can sign straight away.\\nIf that's not your case, check that your name, surname and student ID are written as in your enrolment (capitals, accents and apostrophes don't matter; if you have several first names, the first is enough).\\nIf it still doesn't work, send me your details and signature: the reps will add you.\",\n      \"Ho cercato negli elenchi con il nome della tua email (matricola {v}) e ho trovato:\": \"I searched the class lists using the name in your email (student ID {v}) and found:\",\n      \"Matricola {m} · gruppo {g}\": \"Student ID {m} · {g} group\",\n      \"È la tua matricola nuova?\": \"Is this your new student ID?\",\n      \"No, la scrivo io\": \"No, I'll type it\",\n      \"Sì, collegala\": \"Yes, link it\",\n      \"Collego…\": \"Linking…\",\n      \"Calendario\": \"Calendar\",\n      \"Gruppo\": \"Group\", \"Pari e dispari\": \"Even \u0026 odd\", \"Tutti\": \"All\", \"Pari\": \"Even\", \"Dispari\": \"Odd\",\n      \"Calendario lezioni\": \"Lecture calendar\",\n      \"Il contrappello è solo per chi ha già firmato questa lezione con il link: tu non risulti tra le firme. Se eri in aula e non ci sei riuscito, manda la richiesta ai rappresentanti.\": \"The roll call is only for those who already signed this lesson with the link: you're not among the signatures. If you were in class and couldn't sign, send a request to the reps.\",\n      \"presente a 1 lezione su {n}\": \"present at 1 of {n} lessons\",\n      \"presente a {p} lezioni su {n}\": \"present at {p} of {n} lessons\",\n      \"fuori calendario\": \"not in the calendar\",\n      \"firme aperte adesso: firma per farla contare\": \"signing open now: sign to make it count\",\n      \"Contrappello: se il professore lo fa e tu non rifirmi, quella lezione conta come assenza (a meno che non fossi già uscito con l'orario di uscita); il contrappello vale solo se hai firmato anche con il link. Le lezioni fuori calendario contano finché esistono nell'area riservata.\": \"Roll-call: if the professor does it and you don't sign again, that lesson counts as an absence (unless you had already left with your leaving time). Lessons not in the calendar count as long as they exist in the reps' area.\",\n      \"Niente firme in incognito\": \"No signing in incognito\",\n      \"Da una finestra in incognito (o navigazione privata) non si può firmare: ognuno firma dal proprio telefono, nel browser normale. Chiudi questa finestra e apri il link normalmente.\": \"You can't sign from an incognito (private) window: everyone signs from their own phone, in the normal browser. Close this window and open the link normally.\",\n      \"Non sono in incognito: avvisa i rappresentanti\": \"I'm not in incognito: tell the reps\",\n      \"Dalla navigazione in incognito non si può firmare: apri il link nel browser normale.\": \"You can't sign from incognito browsing: open the link in the normal browser.\",\n      \"Le mie presenze\": \"My attendance\",\n      \"Personalizza\": \"Customize\",\n      \"Siete due persone con lo stesso nome e cognome in elenco\": \"There are two people with your same name and surname on the list\",\n      \"Per questo la tua matricola nuova non si collega da sola. Collegala con Jarvis, ci vuole un attimo:\": \"That's why your new student ID isn't linked automatically. Link it with Jarvis, it only takes a moment:\",\n      \"Tocca «Chiedi a Jarvis» (qui sotto o in alto).\": \"Tap «Ask Jarvis» (below or at the top).\",\n      \"Scrivi: «Ho cambiato matricola».\": \"Write: «I changed my student ID».\",\n      \"Quando te la chiede, scrivi la TUA matricola nuova (quella che risulta nell'elenco).\": \"When asked, type YOUR new student ID (the one on the list).\",\n      \"Jarvis la collega subito e te la scrive qui nel modulo: poi firma normalmente.\": \"Jarvis links it right away and fills it in here: then sign as usual.\",\n      \"Apri Jarvis\": \"Open Jarvis\",\n      \"Scegli i colori: li ritrovi ogni volta che entri con il tuo account, su qualsiasi telefono.\": \"Pick your colours: you'll find them every time you sign in with your account, on any phone.\",\n      \"Tonalità\": \"Hue\",\n      \"Colore originale\": \"Original colour\",\n      \"Ripristina tutto\": \"Reset all\",\n      \"Salva\": \"Save\",\n      \"Salvo…\": \"Saving…\",\n      \"originale\": \"original\",\n      \"Animazione di Jarvis\": \"Jarvis animation\",\n      \"La luce che corre sui bordi e le gocce\": \"The light running along the edges and the drops\",\n      \"Respiro di Jarvis\": \"Jarvis breathing\",\n      \"L'onda che pulsa attorno a Jarvis\": \"The wave pulsing around Jarvis\",\n      \"Jarvis\": \"Jarvis\",\n      \"La sfera di Jarvis (il fiore resta com'è)\": \"Jarvis's sphere (the flower stays as it is)\",\n      \"Sfondo della pagina\": \"Page background\",\n      \"Il colore dietro a tutto\": \"The colour behind everything\",\n      \"Non riesco a calcolare le presenze in questo momento: riprova tra poco.\": \"I can't calculate your attendance right now: try again shortly.\",\n      \"Ancora nessuna lezione finita quest'anno.\": \"No lessons finished yet this year.\",\n      \"{v} h valide su {t} h dell'anno\": \"{v} h counted out of {t} h this year\",\n      \"Controllo i tuoi dati…\": \"Checking your details…\",\n      \"I colori sono salvati su questo telefono, ma non sul tuo account: riprova a premere Salva.\": \"Your colours are saved on this phone but not on your account: try pressing Save again.\",\n      \"Barre delle presenze\": \"Attendance bars\",\n      \"Colore e stile delle barre in «Le mie presenze»\": \"Colour and style of the bars in «My attendance»\",\n      \"Stile delle barre\": \"Bar style\",\n      \"Classica\": \"Classic\", \"Sottile\": \"Thin\", \"Piena\": \"Bold\", \"A segmenti\": \"Segments\", \"Vetro\": \"Glass\", \"Neon\": \"Neon\", \"A righe\": \"Stripes\", \"A puntini\": \"Dots\", \"Scia\": \"Trail\", \"Righello\": \"Ruler\",\n      \"Soglia del {s}% già raggiunta\": \"{s}% threshold already reached\",\n      \"Anche seguendo tutte le lezioni rimaste arrivi al {p}%: sotto il {s}%\": \"Even attending every remaining lesson you reach {p}%: below {s}%\",\n      \"Per restare sopra il {s}% devi seguire tutte le lezioni rimaste\": \"To stay above {s}% you must attend every remaining lesson\",\n      \"Puoi perdere ancora {h} h (circa {n} lezioni) restando sopra il {s}%\": \"You can still miss {h} h (about {n} lessons) and stay above {s}%\",\n      \"Puoi perdere ancora {h} h (circa 1 lezione) restando sopra il {s}%\": \"You can still miss {h} h (about 1 lesson) and stay above {s}%\",\n      \"Puoi perdere ancora {h} h (meno di una lezione) restando sopra il {s}%\": \"You can still miss {h} h (less than one lesson) and stay above {s}%\",\n      \"La tacca sulla barra è il {s}%: la frequenza minima delle ore d'aula di ogni materia (regolamento didattico del corso, art. 10; per i laboratori è il 75%). La riga colorata è un conto esatto sul calendario, non una previsione.\": \"The mark on the bar is {s}%: the minimum attendance of classroom hours for each subject (course regulations, art. 10; 75% for labs). The coloured line is an exact count on the calendar, not a forecast.\",\n      \"1 assenza\": \"1 absence\",\n      \"{n} assenze\": \"{n} absences\",\n      \"1 uscita prima ({m} min)\": \"1 early exit ({m} min)\",\n      \"{n} uscite prima ({m} min)\": \"{n} early exits ({m} min)\",\n      \"Calcolate sulle ore di tutto l'anno dal calendario ufficiale: salgono lezione dopo lezione. Un'uscita prima toglie i minuti fino alla fine della lezione; una firma in ritardo non toglie niente. Le lezioni senza foglio firme contano come presenza.\": \"Calculated on the hours of the whole year from the official calendar: they go up lesson after lesson. An early exit removes the minutes until the end of the lesson; signing late removes nothing. Lessons without a sign-in sheet count as attended.\",\n      \"Calcolo le tue presenze…\": \"Calculating your attendance…\",\n      \"Link scaduto\": \"Link expired\",\n      \"Il link per firmare vale {m} minuti dalla creazione ed è scaduto. Se eri in aula e non hai fatto in tempo, scrivi ai rappresentanti.\": \"The sign-in link is valid for {m} minutes from creation and has expired. If you were in class and didn't make it, write to the reps.\",\n      \"Il link di questa lezione è scaduto: vale 40 minuti dalla creazione.\": \"This lesson's link has expired: it's valid for 40 minutes from creation.\",\n      \"Negli elenchi ci sono due o più persone con il tuo stesso nome e cognome, quindi la matricola nuova non si collega da sola: collegala con Jarvis (i passaggi sono qui sotto l'orario di uscita).\": \"There are two or more people with your same name and surname on the lists, so your new student ID isn't linked automatically: link it with Jarvis (the steps are below the leaving time).\",\n      \"La tua matricola non è negli elenchi della classe: se hai cambiato matricola, collegala con Jarvis.\": \"Your student ID isn't on the class lists: if you changed it, link it with Jarvis.\",\n      \"Il calendario ufficiale non risponde in questo momento: riprova tra poco.\": \"The official calendar isn't responding right now: try again shortly.\",\n      \"Settimana precedente\": \"Previous week\",\n      \"Settimana successiva\": \"Next week\",\n      \"Oggi\": \"Today\",\n      \"Nessuna lezione in questo giorno.\": \"No lectures on this day.\",\n      \"Annullata\": \"Cancelled\",\n      \"In corso\": \"Now\",\n      \"Aggiornato alle {h}\": \"Updated at {h}\",\n      \"Apri University Planner\": \"Open University Planner\",\n      \"Carico il calendario…\": \"Loading the calendar…\",\n      \"Non riesco a caricare il calendario. Riprova tra poco.\": \"I can't load the calendar. Try again shortly.\",\n      \"Riprova\": \"Try again\",\n      \"Firma presenza\": \"Attendance\",\n      \"Carico la lezione…\": \"Loading the lecture…\",\n      \"Firme chiuse\": \"Sign-in closed\",\n      \"Le firme per questa lezione non sono aperte in questo momento.\": \"Sign-in for this lecture isn't open right now.\",\n      \"PER APRIRE IL LINK PER FIRMARE DEVI ACCEDERE CON IL TUO ACCOUNT ISTITUZIONALE.\\nOra sei entrato con {e}, che non è un account @unifg.it: esci da questo account e rientra con quello dell'università.\": \"TO OPEN THE SIGN-IN LINK YOU MUST USE YOUR INSTITUTIONAL ACCOUNT.\\nYou are signed in as {e}, which is not a @unifg.it account: sign out of it and sign back in with your university one.\",\n      \"Accedi con il tuo account UNIFG\": \"Sign in with your UNIFG account\",\n      \"Per firmare il sito deve riconoscerti dal tuo account Google dell'università (quello che finisce con @unifg.it).\": \"To sign, the site needs to recognise you from your university Google account (the one ending in @unifg.it).\",\n      \"Premi il tasto qui sotto e scegli il tuo account @unifg.it.\": \"Tap the button below and choose your @unifg.it account.\",\n      \"Se sul telefono hai più account Google, apri il link in una finestra in incognito ed entra solo con quello UNIFG.\": \"If your phone has several Google accounts, open the link in an incognito window and sign in only with your UNIFG one.\",\n      \"Se hai aperto il link dentro WhatsApp o Instagram, aprilo con Chrome o Safari.\": \"If you opened the link inside WhatsApp or Instagram, open it in Chrome or Safari.\",\n      \"Accedi con l'account UNIFG\": \"Sign in with your UNIFG account\",\n      \"Dati\": \"Details\",\n      \"Firma\": \"Signature\",\n      \"Firmi come\": \"Signing as\",\n      \"Nome\": \"First name\",\n      \"Cognome\": \"Last name\",\n      \"Matricola\": \"Student ID\",\n      \"Orario di uscita \u003cspan class=\\\"opt\\\"\u003efacoltativo\u003c/span\u003e\": \"Leaving time \u003cspan class=\\\"opt\\\"\u003eoptional\u003c/span\u003e\",\n      \"Togli\": \"Clear\",\n      \"Compilalo solo se esci prima della fine della lezione.\": \"Fill this in only if you leave before the end of the lecture.\",\n      \"Scrivi nome e cognome come risultano all'iscrizione: vengono controllati sull'elenco della classe.\": \"Write your name as it appears in your enrolment: it's checked against the class list.\",\n      \"Avanti: firma\": \"Next: sign\",\n      \"Spazio firma\": \"Signature area\",\n      \"Firma col dito sulla riga\": \"Sign on the line with your finger\",\n      \"Indietro\": \"Back\",\n      \"Cancella\": \"Clear\",\n      \"Conferma firma\": \"Confirm signature\",\n      \"Problemi con le firme o devi uscire prima?\": \"Trouble signing, or leaving early?\",\n      \"Chiedi a Jarvis\": \"Ask Jarvis\",\n      \"Feedback e segnalazioni\": \"Feedback and reports\",\n      \"aiutaci a migliorare il sito\": \"help us improve the site\",\n      \"Chiudi\": \"Close\",\n      \"Il messaggio arriva a chi gestisce il foglio firme. Per problemi con la firma di oggi è più veloce chiedere a Jarvis.\": \"Your message goes to whoever runs the sign-in sheet. For problems with today's signature, asking Jarvis is faster.\",\n      \"Quante stelle dai al sito?\": \"How many stars would you give the site?\",\n      \"Di cosa si tratta?\": \"What is it about?\",\n      \"Feedback\": \"Feedback\",\n      \"Segnalazione\": \"Report\",\n      \"Idea\": \"Idea\",\n      \"Messaggio\": \"Message\",\n      \"Messaggio \u003cspan class=\\\"opt\\\"\u003e(facoltativo se dai le stelle)\u003c/span\u003e\": \"Message \u003cspan class=\\\"opt\\\"\u003e(optional if you rate)\u003c/span\u003e\",\n      \"Scrivi qui…\": \"Write here…\",\n      \"Lascia la mia email UNIFG per una risposta\": \"Leave my UNIFG email for a reply\",\n      \"Invia\": \"Send\",\n      \"Apri la chat con Jarvis\": \"Open the chat with Jarvis\",\n      \"Assistente delle firme\": \"Sign-in assistant\",\n      \"Chiudi la chat\": \"Close the chat\",\n      \"Scrivi a Jarvis…\": \"Message Jarvis…\",\n      \"Messaggio per Jarvis\": \"Message for Jarvis\",\n      \"Jarvis può sbagliare. Per i casi particolari scrivi ai rappresentanti.\": \"Jarvis can make mistakes. For special cases, write to the student reps.\",\n      \"Passaggi\": \"Steps\",\n      \"Lingua\": \"Language\",\n      \"Qualcosa non ha funzionato, riprova.\": \"Something went wrong, please try again.\",\n      \"C'è un po' di fila: un attimo, ci siamo quasi…\": \"There's a bit of a queue: one moment, almost there…\",\n      \"Google è molto carico in questo momento: riprova tra un minuto.\": \"Google is very busy right now: please try again in a minute.\",\n      \" · gruppo {g}\": \" · {g} group\",\n      \"~pari\": \"even\", \"~dispari\": \"odd\",\n      \"QR già cambiato\": \"QR already changed\",\n      \"Vale solo il QR proiettato in questo momento: quello che hai aperto è già cambiato. Inquadra di nuovo con la fotocamera il QR sullo schermo dell'aula.\": \"Only the QR on screen right now works: the one you opened has already changed. Scan the QR on the classroom screen again with your camera.\",\n      \"Si firma dal QR in aula\": \"Sign from the QR in class\",\n      \"Per questa lezione la presenza si firma solo inquadrando con la fotocamera il QR proiettato in aula. Il link da solo non basta.\": \"For this lecture you can only sign by scanning the QR projected in class with your camera. The link alone isn't enough.\",\n      \"Link non valido\": \"Invalid link\",\n      \"Compila nome, cognome e matricola.\": \"Fill in first name, last name and student ID.\",\n      \"La matricola può contenere solo cifre e lettere.\": \"The student ID can only contain digits and letters.\",\n      \"Controllo i dati…\": \"Checking your details…\",\n      \"Esci alle {h}\": \"Leaving at {h}\",\n      \"Invio…\": \"Sending…\",\n      \"Invio della firma…\": \"Sending your signature…\",\n      \"Invio del contrappello…\": \"Sending your roll-call signature…\",\n      \"Resta su questa pagina ancora un attimo: sto registrando la firma.\": \"Stay on this page a moment longer: your signature is being recorded.\",\n      \"Firma registrata, {nome}!\": \"Signature saved, {nome}!\",\n      \"Ti abbiamo mandato una email di conferma a {email}. Puoi chiudere la pagina.\": \"We've sent a confirmation email to {email}. You can close the page.\",\n      \"La tua firma è stata registrata. Puoi chiudere la pagina.\": \"Your signature has been saved. You can close the page.\",\n      \"Sto pensando…\": \"Thinking…\",\n      /* Jarvis */\n      \"Come posso aiutarti?\": \"How can I help?\",\n      \"Sono Jarvis, l'assistente delle firme per «{lez}». Scegli qui sotto oppure scrivimi.\": \"I'm Jarvis, the sign-in assistant for “{lez}”. Pick an option below or write to me.\",\n      \"Sono Jarvis, l'assistente delle firme. Scegli qui sotto oppure scrivimi.\": \"I'm Jarvis, the sign-in assistant. Pick an option below or write to me.\",\n      \"Modifica orario di uscita\": \"Change leaving time\",\n      \"Se devi uscire prima della fine\": \"If you need to leave before the end\",\n      \"Dice che i miei dati non corrispondono\": \"It says my details don't match\",\n      \"Nome, cognome o matricola\": \"Name, surname or student ID\",\n      \"Altri problemi\": \"Other problems\",\n      \"Accesso, firma, link…\": \"Sign-in, signature, link…\",\n      \"Collega email con matricola vecchia alla matricola nuova\": \"Link my email with the old student ID to the new one\",\n      \"Mandami dati e firma: ti aggiungono i rappresentanti\": \"Send me your details and signature: the reps will add you\",\n      \"Contatta i rappresentanti (email o WhatsApp)\": \"Contact the reps (email or WhatsApp)\",\n      \"Il sito ti riconosce dal tuo account Google UNIFG. Prova così:\\n• Premi «Accedi con l'account UNIFG» e scegli quello che finisce con @unifg.it.\\n• Se hai più account sul telefono, apri il link in una finestra in incognito ed entra solo con quello UNIFG.\\n• Se il link si apre dentro WhatsApp o Instagram, aprilo con Chrome o Safari.\\nSe ancora non va, mandami i dati e la firma: ti aggiungono i rappresentanti.\": \"The site recognises you from your UNIFG Google account. Try this:\\n• Tap “Sign in with your UNIFG account” and pick the one ending in @unifg.it.\\n• If you have several accounts on your phone, open the link in an incognito window and sign in only with your UNIFG one.\\n• If the link opens inside WhatsApp or Instagram, open it in Chrome or Safari.\\nIf it still doesn't work, send me your details and signature: the reps will add you.\",\n      \"Hai fatto un cambio di corso? Succede quasi sempre per questo: la tua email UNIFG ha ancora la matricola vecchia, mentre nell'elenco c'è quella nuova. Premi il primo pulsante qui sotto: collego io la tua email alla matricola nuova e firmi subito.\\nSe non hai cambiato corso, controlla che nome, cognome e matricola siano scritti come all'iscrizione (maiuscole, accenti e apostrofi non contano; se hai più nomi basta il primo).\\nSe ancora non va, mandami i dati e la firma: ti aggiungono i rappresentanti.\": \"Did you switch degree course? That's almost always the reason: your UNIFG email still has your old student ID, while the class list has the new one. Tap the first button below: I'll link your email to the new ID and you can sign straight away.\\nIf you didn't switch course, check that your name, surname and student ID are written as in your enrolment (capitals, accents and apostrophes don't matter; if you have several first names, the first is enough).\\nIf it still doesn't work, send me your details and signature: the reps will add you.\",\n      \"Proviamo così:\\n• Firma con un dito dentro il riquadro bianco.\\n• Se la pagina scorre mentre firmi, gira il telefono in orizzontale.\\n• Se hai aperto il link dentro WhatsApp o Instagram, aprilo con Chrome o Safari.\\nSe proprio non va, firma nel modulo qui sotto e ti aggiungono i rappresentanti.\": \"Let's try this:\\n• Sign with one finger inside the white box.\\n• If the page scrolls while you sign, turn your phone sideways.\\n• If you opened the link inside WhatsApp or Instagram, open it in Chrome or Safari.\\nIf it really doesn't work, sign in the form below and the reps will add you.\",\n      \"Se vedi «Firme chiuse», i rappresentanti hanno chiuso le firme di questa lezione. Se vedi «Link non valido», fattelo rimandare.\\nSe eri presente, mandami i dati e la firma, oppure scrivi direttamente ai rappresentanti.\": \"If you see “Sign-in closed”, the reps have closed sign-in for this lecture. If you see “Invalid link”, ask for it to be sent again.\\nIf you were there, send me your details and signature, or write to the reps directly.\",\n      \"Vuol dire che la tua firma per questa lezione è già registrata: dovresti aver ricevuto una email di conferma. Se non sei stato tu a firmare, scrivi subito ai rappresentanti.\": \"It means your signature for this lecture is already saved: you should have received a confirmation email. If it wasn't you who signed, write to the reps right away.\",\n      \"Scrivimi qui sotto cosa succede e provo ad aiutarti. Se non si risolve, puoi mandare i dati e la firma ai rappresentanti, oppure scrivergli.\": \"Tell me below what's happening and I'll try to help. If it doesn't get sorted, you can send your details and signature to the reps, or write to them.\",\n      \"Non sono sicuro di aver capito. Se non riesci a firmare, mandami i dati e la firma e ti aggiungono i rappresentanti. Se devi uscire prima, puoi cambiare l'orario di uscita.\": \"I'm not sure I understood. If you can't sign, send me your details and signature and the reps will add you. If you need to leave early, you can change your leaving time.\",\n      \"Il link di questa lezione non è valido, quindi non posso cambiare l'orario. Scrivi ai rappresentanti.\": \"This lecture's link isn't valid, so I can't change the time. Write to the reps.\",\n      \"Per cambiare l'orario devi aprire il link della lezione con il tuo account UNIFG: è così che il sito sa che sei tu. Entra con quello e riprova.\": \"To change the time you need to open the lecture link with your UNIFG account: that's how the site knows it's you. Sign in with it and try again.\",\n      \"Non risulti ancora firmato per questa lezione. Quando firmi, nel modulo trovi il campo «Orario di uscita»: compilalo lì.\": \"You haven't signed for this lecture yet. When you sign, the form has a “Leaving time” field: fill it in there.\",\n      \"Vai al campo orario di uscita\": \"Go to the leaving time field\",\n      \"L'orario di uscita si può cambiare solo il giorno della lezione. Per correzioni scrivi ai rappresentanti.\": \"The leaving time can only be changed on the day of the lecture. For corrections, write to the reps.\",\n      \"Ok {nome}, scegli il nuovo orario. La modifica va subito nel registro dei rappresentanti, senza approvazione.\": \"Ok {nome}, choose the new time. The change goes straight into the reps' register, no approval needed.\",\n      \"Ok, scegli il nuovo orario. La modifica va subito nel registro dei rappresentanti, senza approvazione.\": \"Ok, choose the new time. The change goes straight into the reps' register, no approval needed.\",\n      \"Orario di uscita attuale\": \"Current leaving time\",\n      \"nessuno\": \"none\",\n      \"Nuovo orario\": \"New time\",\n      \"Togli orario\": \"Remove time\",\n      \"Salva orario\": \"Save time\",\n      \"Fatto ✓ Il tuo orario di uscita ora è {h}. È già nel registro.\": \"Done ✓ Your leaving time is now {h}. It's already in the register.\",\n      \"Fatto ✓ Ho tolto l'orario di uscita.\": \"Done ✓ I've removed your leaving time.\",\n      \"Ti ho mandato una email di conferma.\": \"I've sent you a confirmation email.\",\n      \"Scegli l'orario, oppure premi «Togli orario».\": \"Choose a time, or tap “Remove time”.\",\n      \"Per collegare la matricola devi aprire il link della lezione con il tuo account UNIFG: è così che il sito sa che sei tu. Entra con quello e riprova.\": \"To link your student ID you need to open the lecture link with your UNIFG account: that's how the site knows it's you. Sign in with it and try again.\",\n      \"La tua email non contiene una matricola, quindi non c'è niente da collegare. Se il sito non ti fa firmare, mandami i dati e la firma.\": \"Your email doesn't contain a student ID, so there's nothing to link. If the site won't let you sign, send me your details and signature.\",\n      \"La tua email (matricola {v}) è già collegata alla matricola {a}. Nel modulo scrivi {a} e firma normalmente.\": \"Your email (student ID {v}) is already linked to student ID {a}. Write {a} in the form and sign as usual.\",\n      \"Ok! La tua email ha la matricola {v}. Scrivi qui quella nuova: controllo negli elenchi che sia proprio del tuo nome e la collego subito, senza approvazione.\": \"Ok! Your email has student ID {v}. Write the new one here: I'll check the lists that it really matches your name and link it right away, no approval needed.\",\n      \"Matricola nuova\": \"New student ID\",\n      \"Es. 622199\": \"e.g. 622199\",\n      \"Collega matricola\": \"Link student ID\",\n      \"Scrivi la matricola nuova: solo cifre.\": \"Write the new student ID: digits only.\",\n      \"Controllo l'elenco…\": \"Checking the list…\",\n      \"Era già collegata ✓ Ora firmi con la {n}: te l'ho già scritta nel modulo.\": \"It was already linked ✓ Now you sign with {n}: I've already filled it in the form.\",\n      \"Fatto ✓ Ho collegato la matricola {v} alla {n}{chi}. Ora firmi con la {n}: te l'ho già scritta nel modulo.\": \"Done ✓ I've linked student ID {v} to {n}{chi}. Now you sign with {n}: I've already filled it in the form.\",\n      \"Attenzione: la tua matricola è del gruppo {g1}, mentre questa lezione è del gruppo {g2}: usa il link della lezione del tuo gruppo.\": \"Heads up: your student ID is in the {g1} group, but this lecture is for the {g2} group: use your group's lecture link.\",\n      \"Torna al modulo e firma\": \"Back to the form to sign\",\n      \"Puoi contattare i rappresentanti qui:\": \"You can contact the reps here:\",\n      \"Scrivi a tutti i rappresentanti\": \"Write to all the reps\",\n      \"Email\": \"Email\",\n      \"Apri WhatsApp\": \"Open WhatsApp\",\n      \"Al momento non riesco a recuperare i contatti: chiedi ai rappresentanti in aula.\": \"I can't load the contacts right now: ask the reps in class.\",\n      \"Richiesta per i rappresentanti\": \"Request for the reps\",\n      \"Ti aggiungono loro al registro e ti arriva la email di conferma.\": \"They'll add you to the register and you'll get the confirmation email.\",\n      \"Email universitaria \u003cspan class=\\\"opt\\\"\u003e(quella del tuo account)\u003c/span\u003e\": \"University email \u003cspan class=\\\"opt\\\"\u003e(your account's)\u003c/span\u003e\",\n      \"Cosa è successo\": \"What happened\",\n      \"Spazio firma della richiesta\": \"Signature area for the request\",\n      \"Cancella firma\": \"Clear signature\",\n      \"Invia ai rappresentanti\": \"Send to the reps\",\n      \"Scrivi la tua email universitaria (finisce con @unifg.it).\": \"Write your university email (it ends in @unifg.it).\",\n      \"Manca la firma: disegnala nel riquadro.\": \"The signature is missing: draw it in the box.\",\n      \"✓ Richiesta inviata ai rappresentanti\": \"✓ Request sent to the reps\",\n      \"La vedono nella loro area e ti aggiungono al registro. Quando lo fanno, ti arriva una email di conferma a {email}.\": \"They'll see it in their area and add you to the register. When they do, you'll get a confirmation email at {email}.\",\n      /* feedback */\n      \"Scrivi il messaggio.\": \"Write your message.\",\n      \"Scrivi il messaggio oppure dai le stelle.\": \"Write a message or give a star rating.\",\n      \"Grazie, messaggio inviato\": \"Thanks, message sent\",\n      \"Grazie per la valutazione!\": \"Thanks for your rating!\",\n      \"Se serve, ti rispondiamo a {email}.\": \"If needed, we'll reply to {email}.\",\n      \"Lo leggiamo al più presto.\": \"We'll read it as soon as possible.\",\n      \"{n} su 5\": \"{n} out of 5\",\n      \"Pessimo\": \"Terrible\", \"Così così\": \"Meh\", \"Nella media\": \"Okay\", \"Buono\": \"Good\", \"Fantastico!\": \"Amazing!\",\n      /* errori del server */\n      \"Troppe richieste in poco tempo: aspetta qualche minuto e riprova.\": \"Too many requests in a short time: wait a few minutes and try again.\",\n      \"Orario di uscita non valido: usa il formato 11:30, oppure lascialo vuoto.\": \"Invalid leaving time: use the format 11:30, or leave it empty.\",\n      \"Questo link non è valido o la lezione è stata eliminata.\": \"This link isn't valid or the lecture has been deleted.\",\n      \"Il sito non ti riconosce: apri il link della lezione con il tuo account Google UNIFG (@unifg.it).\": \"The site doesn't recognise you: open the lecture link with your UNIFG Google account (@unifg.it).\",\n      \"Le firme per questa lezione sono chiuse.\": \"Sign-in for this lecture is closed.\",\n      \"Con questa email hai già firmato per questa lezione.\": \"You've already signed for this lecture with this email.\",\n      \"Matricola non valida: solo cifre e lettere.\": \"Invalid student ID: digits and letters only.\",\n      \"Firma mancante, riprova.\": \"Signature missing, try again.\",\n      \"Firma troppo grande: cancella e rifalla più piccola.\": \"Signature too big: clear it and draw it smaller.\",\n      \"Non risulti ancora firmato per questa lezione: firma dalla pagina e indica lì l'orario di uscita.\": \"You haven't signed for this lecture yet: sign from the page and enter your leaving time there.\",\n      \"C'è stato il contrappello e non risulti tra chi ha rifirmato: l'orario di uscita non si può più cambiare. Se il contrappello è ancora aperto, inquadra il QR e rifirma: dopo potrai indicare l'uscita.\": \"The roll-call check has taken place and you are not among those who signed again: the leaving time can no longer be changed. If it is still open, scan the QR and sign again: then you can enter your leaving time.\",\n      \"L'indirizzo del tuo account non contiene la matricola, quindi il sito non può sapere che questa matricola è la tua: non puoi firmare da solo. Manda la richiesta ai rappresentanti con «Non riesco a firmare»: ti aggiungono loro.\": \"Your account address has no student ID in it, so the site cannot know this ID is yours: you cannot sign on your own. Send a request to the class reps: they will add you.\",\n      \"Per questa lezione si firma solo inquadrando il QR proiettato in aula. Inquadralo di nuovo con la fotocamera.\": \"For this lecture you can only sign by scanning the QR projected in class. Scan it again with your camera.\",\n      \"La tua email non contiene una matricola, quindi non c'è niente da collegare. Scrivi ai rappresentanti.\": \"Your email doesn't contain a student ID, so there's nothing to link. Write to the reps.\",\n      \"È la stessa matricola della tua email: non serve collegarla.\": \"That's the same student ID as in your email: no need to link it.\",\n      \"Negli elenchi c'è più di una persona con il tuo nome, quindi non posso collegarla io: manda la richiesta ai rappresentanti.\": \"There's more than one person with your name in the lists, so I can't link it myself: send the request to the reps.\",\n      \"Questa matricola è di un rappresentante: il collegamento lo fanno loro a mano.\": \"This student ID belongs to a rep: they do the linking by hand.\",\n      \"Controlla nome e cognome: solo lettere, spazi e apostrofi.\": \"Check your name: letters, spaces and apostrophes only.\",\n      \"Hai appena inviato una richiesta: aspetta un paio di minuti.\": \"You've just sent a request: wait a couple of minutes.\",\n      \"Risulti già firmato per questa lezione: controlla la mail di conferma.\": \"You're already signed in for this lecture: check the confirmation email.\",\n      \"Hai già una richiesta in attesa per questa lezione: i rappresentanti la vedranno a breve.\": \"You already have a pending request for this lecture: the reps will see it soon.\",\n      \"Troppe richieste in attesa per questa lezione: scrivi direttamente ai rappresentanti.\": \"Too many pending requests for this lecture: write to the reps directly.\",\n      \"Arrivano tanti messaggi in questo momento: riprova tra un minuto.\": \"Lots of messages are coming in right now: try again in a minute.\",\n      \"Hai appena mandato un messaggio: aspetta un minuto prima di mandarne un altro.\": \"You've just sent a message: wait a minute before sending another.\"\n    },\n    es: {\n      \"Menu\": \"Menú\",\n      \" · pari e dispari\": \" · par e impar\",\n      \"Link non ancora attivo\": \"Enlace aún no activo\",\n      \"Il link di questa lezione non è ancora attivo: i rappresentanti devono prima mandare al professore la sua area. Riprova tra poco.\": \"El enlace de esta clase aún no está activo: los representantes primero deben enviar al profesor su área. Inténtalo de nuevo en breve.\",\n      \"Versione\": \"Versión\",\n      \"{v} · novità\": \"{v} · novedades\",\n      \"Novità\": \"Novedades\",\n      \"Versione {v}\": \"Versión {v}\",\n      \"Nuova\": \"Nueva\",\n      \"v{v}\": \"v{v}\",\n      \"Contrappello {n}\": \"Segundo pase de lista {n}\",\n      \"Avanti: firma il contrappello\": \"Siguiente: firma el pase de lista\",\n      \"Contrappello già firmato\": \"Pase de lista ya firmado\",\n      \"Hai già firmato questo contrappello. Puoi chiudere la pagina.\": \"Ya has firmado este pase de lista. Puedes cerrar la página.\",\n      \"Contrappello chiuso\": \"Pase de lista cerrado\",\n      \"Il professore ha già chiuso il QR di questo contrappello.\": \"El profesor ya ha cerrado el QR de este pase de lista.\",\n      \"Il contrappello si firma solo inquadrando con la fotocamera il QR proiettato in aula.\": \"El pase de lista solo se firma escaneando con la cámara el QR proyectado en el aula.\",\n      \"Contrappello firmato, {nome}!\": \"¡Pase de lista firmado, {nome}!\",\n      \"La tua presenza al contrappello è registrata. Puoi chiudere la pagina.\": \"Tu presencia en el pase de lista está registrada. Puedes cerrar la página.\",\n      \"Link personale di un'altra persona\": \"Enlace personal de otra persona\",\n      \"Questo link per firmare è personale: funziona solo con l'account a cui è stato mandato. Se è tuo, esci da Google e rientra con il tuo account @unifg.it.\": \"Este enlace para firmar es personal: solo funciona con la cuenta a la que se envió. Si es tuyo, cierra sesión en Google y vuelve a entrar con tu cuenta @unifg.it.\",\n      \"Link scaduto\": \"Enlace caducado\",\n      \"Il link personale valeva 4 ore ed è scaduto. Chiedi al professore di mandartene un altro.\": \"El enlace personal era válido 4 horas y ha caducado. Pide al profesor que te envíe otro.\",\n      \"Questo link personale non è valido. Chiedi al professore di mandartene un altro.\": \"Este enlace personal no es válido. Pide al profesor que te envíe otro.\",\n      \"L'orario di uscita deve essere da adesso in poi: ora sono le {h}.\": \"La hora de salida debe ser a partir de ahora: son las {h}.\",\n      \"Il tuo orario di uscita è già passato: non si può più cambiare. Se è un errore scrivi ai rappresentanti.\": \"Tu hora de salida ya ha pasado: ya no se puede cambiar. Si es un error, escribe a los representantes.\",\n      \"Mi hai già mandato questo messaggio. Se la risposta di prima non ti ha aiutato, prova a spiegarmi meglio cosa succede (per esempio cosa dice la pagina), oppure usa i pulsanti qui sotto.\": \"Ya me has enviado este mensaje. Si la respuesta anterior no te ayudó, intenta explicarme mejor qué pasa (por ejemplo qué dice la página), o usa los botones de abajo.\",\n      \"Stai scrivendo molto velocemente: aspetta un minuto e poi riprova. Intanto puoi usare i pulsanti qui sotto.\": \"Estás escribiendo muy rápido: espera un minuto y vuelve a intentarlo. Mientras tanto puedes usar los botones de abajo.\",\n      \"Non ho capito il messaggio. Scrivimi in poche parole qual è il problema con la firma (per esempio: \\\"dice che la matricola non corrisponde\\\").\": \"No he entendido el mensaje. Escríbeme en pocas palabras cuál es el problema con la firma (por ejemplo: \\\"dice que la matrícula no coincide\\\").\",\n      \"Hai cambiato corso o superato il semestre filtro? Succede quasi sempre per questo: hai una matricola nuova, ma la tua email UNIFG ha ancora quella vecchia. Premi il primo pulsante qui sotto: cerco io la tua matricola nuova negli elenchi e la collego alla tua email, così firmi subito.\\nSe non è il tuo caso, controlla che nome, cognome e matricola siano scritti come all'iscrizione (maiuscole, accenti e apostrofi non contano; se hai più nomi basta il primo).\\nSe ancora non va, mandami i dati e la firma: ti aggiungono i rappresentanti.\": \"¿Has cambiado de carrera o has superado el semestre filtro? Casi siempre es por eso: tienes una matrícula nueva, pero tu email UNIFG todavía tiene la antigua. Pulsa el primer botón de abajo: busco tu matrícula nueva en las listas y la vinculo a tu email, así firmas enseguida.\\nSi no es tu caso, comprueba que nombre, apellido y matrícula estén escritos como en tu matrícula (mayúsculas, acentos y apóstrofos no importan; si tienes varios nombres basta el primero).\\nSi aún no funciona, envíame tus datos y la firma: te añaden los representantes.\",\n      \"Ho cercato negli elenchi con il nome della tua email (matricola {v}) e ho trovato:\": \"He buscado en las listas con el nombre de tu email (matrícula {v}) y he encontrado:\",\n      \"Matricola {m} · gruppo {g}\": \"Matrícula {m} · grupo {g}\",\n      \"È la tua matricola nuova?\": \"¿Es tu matrícula nueva?\",\n      \"No, la scrivo io\": \"No, la escribo yo\",\n      \"Sì, collegala\": \"Sí, vincúlala\",\n      \"Collego…\": \"Vinculando…\",\n      \"Calendario\": \"Calendario\",\n      \"Gruppo\": \"Grupo\", \"Pari e dispari\": \"Pares e impares\", \"Tutti\": \"Todos\", \"Pari\": \"Pares\", \"Dispari\": \"Impares\",\n      \"Calendario lezioni\": \"Calendario de clases\",\n      \"Il contrappello è solo per chi ha già firmato questa lezione con il link: tu non risulti tra le firme. Se eri in aula e non ci sei riuscito, manda la richiesta ai rappresentanti.\": \"El pase de lista es solo para quien ya firmó esta clase con el enlace: no apareces entre las firmas. Si estabas en clase y no pudiste, envía la solicitud a los representantes.\",\n      \"presente a 1 lezione su {n}\": \"presente en 1 de {n} clases\",\n      \"presente a {p} lezioni su {n}\": \"presente en {p} de {n} clases\",\n      \"fuori calendario\": \"fuera del calendario\",\n      \"firme aperte adesso: firma per farla contare\": \"firmas abiertas ahora: firma para que cuente\",\n      \"Contrappello: se il professore lo fa e tu non rifirmi, quella lezione conta come assenza (a meno che non fossi già uscito con l'orario di uscita); il contrappello vale solo se hai firmato anche con il link. Le lezioni fuori calendario contano finché esistono nell'area riservata.\": \"Contrappello: si el profesor lo hace y no vuelves a firmar, esa clase cuenta como ausencia (salvo que ya hubieras salido con la hora de salida). Las clases fuera del calendario cuentan mientras existan en el área reservada.\",\n      \"Niente firme in incognito\": \"Nada de firmas en incógnito\",\n      \"Da una finestra in incognito (o navigazione privata) non si può firmare: ognuno firma dal proprio telefono, nel browser normale. Chiudi questa finestra e apri il link normalmente.\": \"No se puede firmar desde una ventana de incógnito (navegación privada): cada uno firma desde su propio móvil, en el navegador normal. Cierra esta ventana y abre el enlace normalmente.\",\n      \"Non sono in incognito: avvisa i rappresentanti\": \"No estoy en incógnito: avisa a los representantes\",\n      \"Dalla navigazione in incognito non si può firmare: apri il link nel browser normale.\": \"No se puede firmar en navegación de incógnito: abre el enlace en el navegador normal.\",\n      \"Le mie presenze\": \"Mis asistencias\",\n      \"Personalizza\": \"Personalizar\",\n      \"Siete due persone con lo stesso nome e cognome in elenco\": \"Hay dos personas con tu mismo nombre y apellido en la lista\",\n      \"Per questo la tua matricola nuova non si collega da sola. Collegala con Jarvis, ci vuole un attimo:\": \"Por eso tu nueva matrícula no se vincula sola. Vincúlala con Jarvis, es un momento:\",\n      \"Tocca «Chiedi a Jarvis» (qui sotto o in alto).\": \"Toca «Pregunta a Jarvis» (abajo o arriba).\",\n      \"Scrivi: «Ho cambiato matricola».\": \"Escribe: «He cambiado de matrícula».\",\n      \"Quando te la chiede, scrivi la TUA matricola nuova (quella che risulta nell'elenco).\": \"Cuando te la pida, escribe TU nueva matrícula (la que aparece en la lista).\",\n      \"Jarvis la collega subito e te la scrive qui nel modulo: poi firma normalmente.\": \"Jarvis la vincula al momento y la escribe aquí en el formulario: luego firma normalmente.\",\n      \"Apri Jarvis\": \"Abrir Jarvis\",\n      \"Scegli i colori: li ritrovi ogni volta che entri con il tuo account, su qualsiasi telefono.\": \"Elige los colores: los encontrarás cada vez que entres con tu cuenta, en cualquier móvil.\",\n      \"Tonalità\": \"Tono\",\n      \"Colore originale\": \"Color original\",\n      \"Ripristina tutto\": \"Restablecer todo\",\n      \"Salva\": \"Guardar\",\n      \"Salvo…\": \"Guardando…\",\n      \"originale\": \"original\",\n      \"Animazione di Jarvis\": \"Animación de Jarvis\",\n      \"La luce che corre sui bordi e le gocce\": \"La luz que recorre los bordes y las gotas\",\n      \"Respiro di Jarvis\": \"Respiración de Jarvis\",\n      \"L'onda che pulsa attorno a Jarvis\": \"La onda que late alrededor de Jarvis\",\n      \"Jarvis\": \"Jarvis\",\n      \"La sfera di Jarvis (il fiore resta com'è)\": \"La esfera de Jarvis (la flor se queda como está)\",\n      \"Sfondo della pagina\": \"Fondo de la página\",\n      \"Il colore dietro a tutto\": \"El color detrás de todo\",\n      \"Non riesco a calcolare le presenze in questo momento: riprova tra poco.\": \"No puedo calcular tus asistencias ahora: inténtalo dentro de poco.\",\n      \"Ancora nessuna lezione finita quest'anno.\": \"Todavía no ha terminado ninguna clase este año.\",\n      \"{v} h valide su {t} h dell'anno\": \"{v} h válidas de {t} h del año\",\n      \"Controllo i tuoi dati…\": \"Comprobando tus datos…\",\n      \"I colori sono salvati su questo telefono, ma non sul tuo account: riprova a premere Salva.\": \"Los colores se han guardado en este teléfono, pero no en tu cuenta: vuelve a pulsar Guardar.\",\n      \"Barre delle presenze\": \"Barras de asistencia\",\n      \"Colore e stile delle barre in «Le mie presenze»\": \"Color y estilo de las barras en «Mis asistencias»\",\n      \"Stile delle barre\": \"Estilo de las barras\",\n      \"Classica\": \"Clásica\", \"Sottile\": \"Fina\", \"Piena\": \"Gruesa\", \"A segmenti\": \"Segmentos\", \"Vetro\": \"Cristal\", \"Neon\": \"Neón\", \"A righe\": \"Rayas\", \"A puntini\": \"Puntos\", \"Scia\": \"Estela\", \"Righello\": \"Regla\",\n      \"Soglia del {s}% già raggiunta\": \"Umbral del {s}% ya alcanzado\",\n      \"Anche seguendo tutte le lezioni rimaste arrivi al {p}%: sotto il {s}%\": \"Aun asistiendo a todas las clases restantes llegas al {p}%: por debajo del {s}%\",\n      \"Per restare sopra il {s}% devi seguire tutte le lezioni rimaste\": \"Para quedarte por encima del {s}% debes asistir a todas las clases restantes\",\n      \"Puoi perdere ancora {h} h (circa {n} lezioni) restando sopra il {s}%\": \"Aún puedes perder {h} h (unas {n} clases) y quedarte por encima del {s}%\",\n      \"Puoi perdere ancora {h} h (circa 1 lezione) restando sopra il {s}%\": \"Aún puedes perder {h} h (una clase) y quedarte por encima del {s}%\",\n      \"Puoi perdere ancora {h} h (meno di una lezione) restando sopra il {s}%\": \"Aún puedes perder {h} h (menos de una clase) y quedarte por encima del {s}%\",\n      \"La tacca sulla barra è il {s}%: la frequenza minima delle ore d'aula di ogni materia (regolamento didattico del corso, art. 10; per i laboratori è il 75%). La riga colorata è un conto esatto sul calendario, non una previsione.\": \"La marca en la barra es el {s}%: la asistencia mínima de las horas de aula de cada asignatura (reglamento del curso, art. 10; en laboratorios el 75%). La línea de color es un cálculo exacto sobre el calendario, no una previsión.\",\n      \"1 assenza\": \"1 ausencia\",\n      \"{n} assenze\": \"{n} ausencias\",\n      \"1 uscita prima ({m} min)\": \"1 salida anticipada ({m} min)\",\n      \"{n} uscite prima ({m} min)\": \"{n} salidas anticipadas ({m} min)\",\n      \"Calcolate sulle ore di tutto l'anno dal calendario ufficiale: salgono lezione dopo lezione. Un'uscita prima toglie i minuti fino alla fine della lezione; una firma in ritardo non toglie niente. Le lezioni senza foglio firme contano come presenza.\": \"Calculadas sobre las horas de todo el año del calendario oficial: suben clase tras clase. Una salida anticipada resta los minutos hasta el final de la clase; firmar tarde no resta nada. Las clases sin hoja de firmas cuentan como asistencia.\",\n      \"Calcolo le tue presenze…\": \"Calculando tus asistencias…\",\n      \"Link scaduto\": \"Enlace caducado\",\n      \"Il link per firmare vale {m} minuti dalla creazione ed è scaduto. Se eri in aula e non hai fatto in tempo, scrivi ai rappresentanti.\": \"El enlace para firmar vale {m} minutos desde su creación y ha caducado. Si estabas en clase y no llegaste a tiempo, escribe a los representantes.\",\n      \"Il link di questa lezione è scaduto: vale 40 minuti dalla creazione.\": \"El enlace de esta clase ha caducado: vale 40 minutos desde su creación.\",\n      \"Negli elenchi ci sono due o più persone con il tuo stesso nome e cognome, quindi la matricola nuova non si collega da sola: collegala con Jarvis (i passaggi sono qui sotto l'orario di uscita).\": \"En las listas hay dos o más personas con tu mismo nombre y apellido, así que la nueva matrícula no se vincula sola: vincúlala con Jarvis (los pasos están debajo de la hora de salida).\",\n      \"La tua matricola non è negli elenchi della classe: se hai cambiato matricola, collegala con Jarvis.\": \"Tu matrícula no está en las listas de la clase: si la has cambiado, vincúlala con Jarvis.\",\n      \"Il calendario ufficiale non risponde in questo momento: riprova tra poco.\": \"El calendario oficial no responde ahora: inténtalo dentro de poco.\",\n      \"Settimana precedente\": \"Semana anterior\",\n      \"Settimana successiva\": \"Semana siguiente\",\n      \"Oggi\": \"Hoy\",\n      \"Nessuna lezione in questo giorno.\": \"No hay clases este día.\",\n      \"Annullata\": \"Cancelada\",\n      \"In corso\": \"En curso\",\n      \"Aggiornato alle {h}\": \"Actualizado a las {h}\",\n      \"Apri University Planner\": \"Abrir University Planner\",\n      \"Carico il calendario…\": \"Cargando el calendario…\",\n      \"Non riesco a caricare il calendario. Riprova tra poco.\": \"No consigo cargar el calendario. Inténtalo de nuevo en un momento.\",\n      \"Riprova\": \"Reintentar\",\n      \"Firma presenza\": \"Asistencia\",\n      \"Carico la lezione…\": \"Cargando la clase…\",\n      \"Firme chiuse\": \"Firmas cerradas\",\n      \"Le firme per questa lezione non sono aperte in questo momento.\": \"Las firmas de esta clase no están abiertas en este momento.\",\n      \"PER APRIRE IL LINK PER FIRMARE DEVI ACCEDERE CON IL TUO ACCOUNT ISTITUZIONALE.\\nOra sei entrato con {e}, che non è un account @unifg.it: esci da questo account e rientra con quello dell'università.\": \"PARA ABRIR EL ENLACE DE FIRMA DEBES ENTRAR CON TU CUENTA INSTITUCIONAL.\\nAhora has entrado con {e}, que no es una cuenta @unifg.it: cierra esa sesión y vuelve a entrar con la de la universidad.\",\n      \"Accedi con il tuo account UNIFG\": \"Inicia sesión con tu cuenta UNIFG\",\n      \"Per firmare il sito deve riconoscerti dal tuo account Google dell'università (quello che finisce con @unifg.it).\": \"Para firmar, el sitio tiene que reconocerte por tu cuenta Google de la universidad (la que termina en @unifg.it).\",\n      \"Premi il tasto qui sotto e scegli il tuo account @unifg.it.\": \"Pulsa el botón de abajo y elige tu cuenta @unifg.it.\",\n      \"Se sul telefono hai più account Google, apri il link in una finestra in incognito ed entra solo con quello UNIFG.\": \"Si tienes varias cuentas de Google en el móvil, abre el enlace en una ventana de incógnito y entra solo con la de UNIFG.\",\n      \"Se hai aperto il link dentro WhatsApp o Instagram, aprilo con Chrome o Safari.\": \"Si abriste el enlace dentro de WhatsApp o Instagram, ábrelo con Chrome o Safari.\",\n      \"Accedi con l'account UNIFG\": \"Entrar con la cuenta UNIFG\",\n      \"Dati\": \"Datos\",\n      \"Firma\": \"Firma\",\n      \"Firmi come\": \"Firmas como\",\n      \"Nome\": \"Nombre\",\n      \"Cognome\": \"Apellido\",\n      \"Matricola\": \"Matrícula\",\n      \"Orario di uscita \u003cspan class=\\\"opt\\\"\u003efacoltativo\u003c/span\u003e\": \"Hora de salida \u003cspan class=\\\"opt\\\"\u003eopcional\u003c/span\u003e\",\n      \"Togli\": \"Quitar\",\n      \"Compilalo solo se esci prima della fine della lezione.\": \"Rellénalo solo si sales antes de que termine la clase.\",\n      \"Scrivi nome e cognome come risultano all'iscrizione: vengono controllati sull'elenco della classe.\": \"Escribe nombre y apellido como en tu matrícula: se comprueban con la lista de la clase.\",\n      \"Avanti: firma\": \"Siguiente: firmar\",\n      \"Spazio firma\": \"Espacio para la firma\",\n      \"Firma col dito sulla riga\": \"Firma con el dedo sobre la línea\",\n      \"Indietro\": \"Atrás\",\n      \"Cancella\": \"Borrar\",\n      \"Conferma firma\": \"Confirmar firma\",\n      \"Problemi con le firme o devi uscire prima?\": \"¿Problemas con la firma o tienes que salir antes?\",\n      \"Chiedi a Jarvis\": \"Pregunta a Jarvis\",\n      \"Feedback e segnalazioni\": \"Comentarios y avisos\",\n      \"aiutaci a migliorare il sito\": \"ayúdanos a mejorar el sitio\",\n      \"Chiudi\": \"Cerrar\",\n      \"Il messaggio arriva a chi gestisce il foglio firme. Per problemi con la firma di oggi è più veloce chiedere a Jarvis.\": \"El mensaje llega a quien gestiona la hoja de firmas. Para problemas con la firma de hoy es más rápido preguntar a Jarvis.\",\n      \"Quante stelle dai al sito?\": \"¿Cuántas estrellas le das al sitio?\",\n      \"Di cosa si tratta?\": \"¿De qué se trata?\",\n      \"Feedback\": \"Comentario\",\n      \"Segnalazione\": \"Aviso\",\n      \"Idea\": \"Idea\",\n      \"Messaggio\": \"Mensaje\",\n      \"Messaggio \u003cspan class=\\\"opt\\\"\u003e(facoltativo se dai le stelle)\u003c/span\u003e\": \"Mensaje \u003cspan class=\\\"opt\\\"\u003e(opcional si valoras)\u003c/span\u003e\",\n      \"Scrivi qui…\": \"Escribe aquí…\",\n      \"Lascia la mia email UNIFG per una risposta\": \"Dejar mi email UNIFG para recibir respuesta\",\n      \"Invia\": \"Enviar\",\n      \"Apri la chat con Jarvis\": \"Abrir el chat con Jarvis\",\n      \"Assistente delle firme\": \"Asistente de firmas\",\n      \"Chiudi la chat\": \"Cerrar el chat\",\n      \"Scrivi a Jarvis…\": \"Escribe a Jarvis…\",\n      \"Messaggio per Jarvis\": \"Mensaje para Jarvis\",\n      \"Jarvis può sbagliare. Per i casi particolari scrivi ai rappresentanti.\": \"Jarvis puede equivocarse. Para casos especiales escribe a los representantes.\",\n      \"Passaggi\": \"Pasos\",\n      \"Lingua\": \"Idioma\",\n      \"Qualcosa non ha funzionato, riprova.\": \"Algo no ha funcionado, inténtalo de nuevo.\",\n      \"C'è un po' di fila: un attimo, ci siamo quasi…\": \"Hay un poco de cola: un momento, ya casi está…\",\n      \"Google è molto carico in questo momento: riprova tra un minuto.\": \"Google está muy ocupado ahora mismo: inténtalo de nuevo en un minuto.\",\n      \" · gruppo {g}\": \" · grupo {g}\",\n      \"~pari\": \"par\", \"~dispari\": \"impar\",\n      \"QR già cambiato\": \"El QR ya ha cambiado\",\n      \"Vale solo il QR proiettato in questo momento: quello che hai aperto è già cambiato. Inquadra di nuovo con la fotocamera il QR sullo schermo dell'aula.\": \"Solo vale el QR proyectado en este momento: el que abriste ya ha cambiado. Vuelve a escanear con la cámara el QR de la pantalla del aula.\",\n      \"Si firma dal QR in aula\": \"Se firma con el QR del aula\",\n      \"Per questa lezione la presenza si firma solo inquadrando con la fotocamera il QR proiettato in aula. Il link da solo non basta.\": \"En esta clase la asistencia solo se firma escaneando con la cámara el QR proyectado en el aula. El enlace solo no basta.\",\n      \"Link non valido\": \"Enlace no válido\",\n      \"Compila nome, cognome e matricola.\": \"Rellena nombre, apellido y matrícula.\",\n      \"La matricola può contenere solo cifre e lettere.\": \"La matrícula solo puede contener cifras y letras.\",\n      \"Controllo i dati…\": \"Comprobando los datos…\",\n      \"Esci alle {h}\": \"Sales a las {h}\",\n      \"Invio…\": \"Enviando…\",\n      \"Invio della firma…\": \"Enviando tu firma…\",\n      \"Invio del contrappello…\": \"Enviando la firma del control…\",\n      \"Resta su questa pagina ancora un attimo: sto registrando la firma.\": \"Quédate en esta página un momento más: estoy registrando tu firma.\",\n      \"Firma registrata, {nome}!\": \"¡Firma registrada, {nome}!\",\n      \"Ti abbiamo mandato una email di conferma a {email}. Puoi chiudere la pagina.\": \"Te hemos enviado un email de confirmación a {email}. Puedes cerrar la página.\",\n      \"La tua firma è stata registrata. Puoi chiudere la pagina.\": \"Tu firma ha sido registrada. Puedes cerrar la página.\",\n      \"Sto pensando…\": \"Pensando…\",\n      \"Come posso aiutarti?\": \"¿Cómo puedo ayudarte?\",\n      \"Sono Jarvis, l'assistente delle firme per «{lez}». Scegli qui sotto oppure scrivimi.\": \"Soy Jarvis, el asistente de firmas de «{lez}». Elige abajo o escríbeme.\",\n      \"Sono Jarvis, l'assistente delle firme. Scegli qui sotto oppure scrivimi.\": \"Soy Jarvis, el asistente de firmas. Elige abajo o escríbeme.\",\n      \"Modifica orario di uscita\": \"Cambiar hora de salida\",\n      \"Se devi uscire prima della fine\": \"Si tienes que salir antes del final\",\n      \"Dice che i miei dati non corrispondono\": \"Dice que mis datos no coinciden\",\n      \"Nome, cognome o matricola\": \"Nombre, apellido o matrícula\",\n      \"Altri problemi\": \"Otros problemas\",\n      \"Accesso, firma, link…\": \"Acceso, firma, enlace…\",\n      \"Collega email con matricola vecchia alla matricola nuova\": \"Vincular el email con la matrícula antigua a la nueva\",\n      \"Mandami dati e firma: ti aggiungono i rappresentanti\": \"Envíame tus datos y firma: te añaden los representantes\",\n      \"Contatta i rappresentanti (email o WhatsApp)\": \"Contactar a los representantes (email o WhatsApp)\",\n      \"Il sito ti riconosce dal tuo account Google UNIFG. Prova così:\\n• Premi «Accedi con l'account UNIFG» e scegli quello che finisce con @unifg.it.\\n• Se hai più account sul telefono, apri il link in una finestra in incognito ed entra solo con quello UNIFG.\\n• Se il link si apre dentro WhatsApp o Instagram, aprilo con Chrome o Safari.\\nSe ancora non va, mandami i dati e la firma: ti aggiungono i rappresentanti.\": \"El sitio te reconoce por tu cuenta Google UNIFG. Prueba así:\\n• Pulsa «Entrar con la cuenta UNIFG» y elige la que termina en @unifg.it.\\n• Si tienes varias cuentas en el móvil, abre el enlace en una ventana de incógnito y entra solo con la de UNIFG.\\n• Si el enlace se abre dentro de WhatsApp o Instagram, ábrelo con Chrome o Safari.\\nSi aún no funciona, envíame tus datos y la firma: te añaden los representantes.\",\n      \"Hai fatto un cambio di corso? Succede quasi sempre per questo: la tua email UNIFG ha ancora la matricola vecchia, mentre nell'elenco c'è quella nuova. Premi il primo pulsante qui sotto: collego io la tua email alla matricola nuova e firmi subito.\\nSe non hai cambiato corso, controlla che nome, cognome e matricola siano scritti come all'iscrizione (maiuscole, accenti e apostrofi non contano; se hai più nomi basta il primo).\\nSe ancora non va, mandami i dati e la firma: ti aggiungono i rappresentanti.\": \"¿Has cambiado de carrera? Casi siempre es por eso: tu email UNIFG todavía tiene la matrícula antigua, mientras que en la lista está la nueva. Pulsa el primer botón de abajo: vinculo tu email a la matrícula nueva y firmas enseguida.\\nSi no has cambiado de carrera, comprueba que nombre, apellido y matrícula estén escritos como en tu matrícula (mayúsculas, acentos y apóstrofos no importan; si tienes varios nombres basta el primero).\\nSi aún no funciona, envíame tus datos y la firma: te añaden los representantes.\",\n      \"Proviamo così:\\n• Firma con un dito dentro il riquadro bianco.\\n• Se la pagina scorre mentre firmi, gira il telefono in orizzontale.\\n• Se hai aperto il link dentro WhatsApp o Instagram, aprilo con Chrome o Safari.\\nSe proprio non va, firma nel modulo qui sotto e ti aggiungono i rappresentanti.\": \"Probemos así:\\n• Firma con un dedo dentro del recuadro blanco.\\n• Si la página se mueve mientras firmas, pon el móvil en horizontal.\\n• Si abriste el enlace dentro de WhatsApp o Instagram, ábrelo con Chrome o Safari.\\nSi de verdad no funciona, firma en el formulario de abajo y te añaden los representantes.\",\n      \"Se vedi «Firme chiuse», i rappresentanti hanno chiuso le firme di questa lezione. Se vedi «Link non valido», fattelo rimandare.\\nSe eri presente, mandami i dati e la firma, oppure scrivi direttamente ai rappresentanti.\": \"Si ves «Firmas cerradas», los representantes han cerrado las firmas de esta clase. Si ves «Enlace no válido», pide que te lo reenvíen.\\nSi estuviste presente, envíame tus datos y la firma, o escribe directamente a los representantes.\",\n      \"Vuol dire che la tua firma per questa lezione è già registrata: dovresti aver ricevuto una email di conferma. Se non sei stato tu a firmare, scrivi subito ai rappresentanti.\": \"Significa que tu firma de esta clase ya está registrada: deberías haber recibido un email de confirmación. Si no firmaste tú, escribe enseguida a los representantes.\",\n      \"Scrivimi qui sotto cosa succede e provo ad aiutarti. Se non si risolve, puoi mandare i dati e la firma ai rappresentanti, oppure scrivergli.\": \"Escríbeme abajo qué pasa e intento ayudarte. Si no se resuelve, puedes enviar tus datos y la firma a los representantes, o escribirles.\",\n      \"Non sono sicuro di aver capito. Se non riesci a firmare, mandami i dati e la firma e ti aggiungono i rappresentanti. Se devi uscire prima, puoi cambiare l'orario di uscita.\": \"No estoy seguro de haberte entendido. Si no puedes firmar, envíame tus datos y la firma y te añaden los representantes. Si tienes que salir antes, puedes cambiar la hora de salida.\",\n   /* 5) monta la pagina firme vera (la stessa del sito) dentro questo documento */
  function esc(v){ return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
  function nuovo(n){ var s = document.createElement("script"); for(var i = 0; i < n.attributes.length; i++) s.setAttribute(n.attributes[i].name, n.attributes[i].value); s.text = n.text; return s; }
  function metti(dove, n){
    if(n.nodeName === "SCRIPT"){ dove.appendChild(nuovo(n)); return; }
    var c = document.importNode(n, true); dove.appendChild(c);
    if(c.querySelectorAll){ var ss = c.querySelectorAll("script"); for(var i = 0; i < ss.length; i++) ss[i].parentNode.replaceChild(nuovo(ss[i]), ss[i]); }
  }
  function monta(dati){
    var html = TPL.replace(/<\?=\s*([A-Za-z_]\w*)\s*\?>/g, function(m, k){ return esc(dati[k]); });
    var d = new DOMParser().parseFromString(html, "text/html");
    document.title = d.title || document.title;
    var hd = document.head, bd = document.body;
    [].slice.call(d.head.childNodes).forEach(function(n){ if(n.nodeName !== "TITLE" && n.nodeName !== "BASE" && n.nodeName !== "META") metti(hd, n); });
    var st = document.getElementById("svStile"); if(st) st.textContent = "#svAvviso{position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#1d3a8a;color:#fff;border-radius:12px;padding:12px 14px;font:600 15px/1.4 system-ui,sans-serif}#svAvviso a{color:#fff}";
    while(bd.firstChild) bd.removeChild(bd.firstChild); bd.removeAttribute("style");
    for(var i = 0; i < d.body.attributes.length; i++) bd.setAttribute(d.body.attributes[i].name, d.body.attributes[i].value);
    [].slice.call(d.body.childNodes).forEach(function(n){ metti(bd, n); });
  }
  /* 6) il «timbro» parte SUBITO; intanto la pagina firme si monta e mostra il suo caricamento */
  var STILE = document.getElementById("svStile").textContent;
  var tAvvio = (W.performance && performance.timing && performance.timing.navigationStart) || Date.now(), tPost = Date.now(), giri = 0;
  function fatale(e){
    var s = String(e.message || "");
    document.head.insertAdjacentHTML("beforeend", "<style>" + STILE + "</style>");
    document.body.innerHTML = '<div class="gs" id="gs"></div>'; box = document.getElementById("gs");
    if(e.codice === "ELENCO") schermo(T.errore, s);
    else schermo(T.riattiva, s, T.attiva, ATTIVA);
  }
  var APRI = new Promise(function(ok, ko){
    function prova(){
      post("apri", A).then(ok, function(e){
        var s = String(e.message || ""), certo = CERTO.test(s), rete = !certo && /NetworkError/.test(s);
        if(e.codice === "SPENTA" || e.codice === "CLASSICA"){ location.replace(CLASSICO); return; }   // firma classica accesa nelle impostazioni
        if(rete && !ls(KOK) && giri >= 2){ location.replace(CLASSICO); return; }   // il foglio non ha mai risposto da qui: link classico
        if((certo || rete) && Date.now() - tPost < 120000){ giri++; setTimeout(prova, Math.min(2500, 250 * Math.pow(1.5, giri)) * (0.6 + Math.random() * 0.8)); return; }
        ko(e);
      });
    }
    prova();
  });
  APRI.then(function(d){
    if(d.admin) ls(KA, "1"); else ls(KA, null);
    var bd = document.body.dataset; bd.pass = d.pass || ""; bd.esito = d.qrEsito || ""; bd.admin = d.admin || ""; bd.home = d.home || CFG.home;
    if(d.admin){
      var ab = document.getElementById("adminBar"), hl = document.getElementById("homeLink"); if(ab) ab.hidden = false; if(hl) hl.href = bd.home;
      var ms = d.ms || {}, tot = Date.now() - tPost, g = ms.google || 0, sec = function(x){ return (Math.round(x / 100) / 10).toString().replace(".", ","); };
      var riga = document.createElement("div");
      riga.style.cssText = "position:fixed;left:8px;bottom:8px;z-index:99998;background:rgba(20,24,36,.82);color:#fff;font:600 11px/1.3 system-ui,sans-serif;padding:5px 8px;border-radius:8px;pointer-events:none";
      riga.textContent = "⏱ pagina " + sec(tPost - tAvvio) + " s · Google " + sec(tot) + " s (lavoro " + sec(g) + ": tessera " + sec(ms.tessera || 0) + ", QR " + sec(ms.qr || 0) + ", lezione " + sec(ms.lezione || 0) + " · viaggio " + sec(Math.max(0, tot - g)) + ")" + (giri ? " · " + giri + " riprove" : "");
      document.body.appendChild(riga); setTimeout(function(){ riga.remove(); }, 15000);
    }
  }, function(){});
  /* la pagina chiede i dati della lezione: arrivano dal timbro già partito (nessuna chiamata in più) */
  var primaInfo = true;
  W.__svInfo = function(args){
    if(!primaInfo) return null;
    primaInfo = false;
    return APRI.then(function(d){
      if(d.pre){ var r = JSON.parse(d.pre); if(d.pass && !r.pass) r.pass = d.pass; return r; }
      return post("infoLezione", [A.l, (d.pass || d.qrEsito === "scaduto") ? "" : A.q, d.pass || args[2] || "", A.c]);
    }, function(e){
      if(e.codice === "TESSERA" || e.codice === "DISPOSITIVO" || e.codice === "ELENCO"){ fatale(e); return new Promise(function(){}); }   // la pagina firme non c'è più: niente altro
      throw e;
    });
  };
  /* chi sei lo dice già la tessera (la parte prima del punto, leggibile; la firma dopo il punto la controlla solo Google) */
  function emailTessera(t){
    try { var b = String(t || "").split(".")[0].replace(/-/g, "+").replace(/_/g, "/"); while(b.length % 4) b += "=";
      var p = atob(b).split("|"); return (p[0] === "v1" && p[1] && p[1].indexOf("@") > 0) ? p[1] : ""; } catch(e){ return ""; }
  }
  monta({ l: A.l, q: A.q, cp: A.c, inv: A.t, pass: "", qrEsito: "", admin: ls(KA), home: CFG.home, pre: "", email: emailTessera(ls(KT)) });
})();
